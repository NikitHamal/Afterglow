plugins {
    id 'com.android.application'
}

// SDL3 source clone (workflow provides SDL_SRC=...); its Java activity is
// compiled in and its CMake builds the native SDL lib from the same tree,
// so Java and C++ can never drift apart.
def sdlSrc = providers.environmentVariable("SDL_SRC").getOrElse("../sdl-src")

android {
    namespace "com.afterglow.game"
    compileSdk 34

    defaultConfig {
        applicationId "com.afterglow.game"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        externalNativeBuild {
            cmake {
                arguments "-DSDL_SRC=" + sdlSrc, "-DANDROID_STL=c++_shared"
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }
    sourceSets {
        main {
            manifest.srcFile "src/main/AndroidManifest.xml"
            java.srcDirs += [sdlSrc + "/android-project/app/src/main/java"]
            assets.srcDirs += ["src/main/assets", "../../assets"]
        }
    }
}
