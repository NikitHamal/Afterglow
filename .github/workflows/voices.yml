name: voices
# Story voice acting: synthesises every spoken story line with Kokoro-82M (Apache-2.0) on the runner and commits
# the OGGs + manifest to native/assets/story/voice. Content-addressed: only changed lines are re-synthesised.
on:
  workflow_dispatch:
    inputs:
      only: { description: "story id (empty = all)", required: false, default: "" }
      limit: { description: "max new lines (0 = all)", required: false, default: "0" }
  push:
    branches: [main]
    paths:
      - 'native/assets/story/*.json'
      - 'tools/voice/**'
      - '.github/workflows/voices.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: voices
  cancel-in-progress: false
jobs:
  voices:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Cache models + wheels
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: kokoro-v1-${{ runner.os }}-py312
      - name: Install Kokoro (CPU)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile numpy "misaki[en]" \
            https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Synthesise
        run: python tools/voice/gen_voices.py --only "${{ github.event.inputs.only }}" --limit "${{ github.event.inputs.limit || 0 }}"
      - name: Commit voices
        id: commit
        run: |
          git config user.name "afterglow-voices"
          git config user.email "actions@users.noreply.github.com"
          git add -A native/assets/story/voice
          if git diff --cached --quiet; then echo "no voice changes"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -qm "Story voices (Kokoro) for ${GITHUB_SHA::7}"
          for i in 1 2 3 4 5 6; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep $((i*9))
          done
          exit 1
      - name: Rebuild the game with the new voices
        if: steps.commit.outputs.pushed == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run native.yml --ref main
