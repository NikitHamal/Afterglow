name: android

on:
  push:
    branches: [main, qoder/kimi3.1]
    paths:
      - 'native/**'
      - 'tools/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: build-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'
          log-accepted-android-sdk-licenses: true

      - name: GLES shaders + trimmed assets (Vivian and Marcus)
        run: |
          python3 tools/android/es_shaders.py
          python3 tools/android/prepare_assets.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        working-directory: native/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: afterglow-android
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
